[project]
name = "insider-detection"
version = "0.1.0"
description = "Kalshi insider trading anomaly detection"
requires-python = ">=3.11"
dependencies = [
  "psycopg2-binary>=2.9.9",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
