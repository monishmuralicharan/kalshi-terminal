services:
  redis:
    image: redis:7
    ports:
      - '6379:6379'

  market-data:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    command: ['node', 'services/market-data/index.js']

  dashboard-api:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - '4010:4010'
    depends_on:
      - redis
    command: ['node', 'services/dashboard-api/index.js']
