services:
  redis:
    image: redis:7
    ports:
      - '6379:6379'

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi
      POSTGRES_DB: kalshi
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  market-data:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    command: ['node', 'services/market-data/index.js']

  market-matching:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - timescaledb
    command: ['node', 'services/market-matching/index.js']

  insider-detection:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file: .env
    depends_on:
      - timescaledb
    command: >
      sh -c "pip install -q -r services/insider-detection/requirements.txt &&
             python services/insider-detection/index.py"

  dashboard-api:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - '4010:4010'
    depends_on:
      - redis
      - timescaledb
    command: ['node', 'services/dashboard-api/index.js']

volumes:
  timescaledb_data:
